# Builds CryptoPilot-Setup-X.Y.Z.exe on Windows and tests it in an isolated folder.
# Pull requests and manual runs upload the installer as a workflow artifact.
# Pushing a tag vX.Y.Z (matching updater.APP_VERSION) also publishes a GitHub
# Release, which is what the in-app updater installs from.
name: Windows installer

on:
  push:
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      CRYPTOPILOT_NO_UPDATE_CHECK: '1'
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Read app version
        id: version
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, 'scripts')
          import build_installer
          version = build_installer.app_version()
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/v{version}':
              sys.exit(f'Tag {ref} does not match updater.APP_VERSION {version}. Bump APP_VERSION first.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
          print('CryptoPilot', version)

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create build environment
        run: |
          python -m venv .build-venv
          .build-venv\Scripts\python.exe scripts\bootstrap.py --build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run tests on Windows
        run: |
          .build-venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-dev-lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .build-venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build dependency runtime
        run: |
          .build-venv\Scripts\python.exe -m PyInstaller --noconfirm --distpath dist\editable-runtime CryptoPilotEditable.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Compile installer
        run: |
          .build-venv\Scripts\python.exe scripts\build_installer.py --runtime-dir dist\editable-runtime\CryptoPilotRuntime --stage dist\editable-stage --output dist\installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Smoke test frozen runtime (simulated exchange)
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\frozen" | Out-Null
          .build-venv\Scripts\python.exe tests\smoke_frozen_orders.py --runtime dist\editable-runtime\CryptoPilotRuntime --work "$env:RUNNER_TEMP\frozen"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Smoke test installer (install, update, upgrade, uninstall)
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\setup" | Out-Null
          .build-venv\Scripts\python.exe tests\smoke_installer.py --setup "dist\installer\CryptoPilot-Setup-${{ steps.version.outputs.version }}.exe" --work "$env:RUNNER_TEMP\setup"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Write checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          setup = Path('dist/installer/CryptoPilot-Setup-${{ steps.version.outputs.version }}.exe')
          digest = hashlib.sha256(setup.read_bytes()).hexdigest()
          setup.with_name(setup.name + '.sha256').write_text(f'{digest}  {setup.name}\n', encoding='ascii')
          print(digest, setup.name)

      - uses: actions/upload-artifact@v5
        with:
          name: CryptoPilot-Setup-${{ steps.version.outputs.version }}
          path: |
            dist/installer/CryptoPilot-Setup-*.exe
            dist/installer/CryptoPilot-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Keep smoke-test logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/setup/**/*.log
            ${{ runner.temp }}/setup/**/result.json
          if-no-files-found: ignore

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: CryptoPilot-Setup-${{ needs.build.outputs.version }}
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "CryptoPilot $VERSION" --generate-notes
