# Builds CryptoPilot-Setup-X.Y.Z.exe on Windows and tests it in an isolated folder.
# Every run uploads the installer as a workflow artifact. Every push to main (a
# merged pull request) also publishes it as GitHub Release vX.Y.Z, which is what
# the in-app updater installs from. X.Y comes from updater.APP_VERSION and Z is
# the number of commits on main, so each merge is newer than the last.
name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      CRYPTOPILOT_NO_UPDATE_CHECK: '1'
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The release version counts the commits on main.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Choose release version
        id: version
        shell: python
        run: |
          import os, subprocess, sys
          sys.path.insert(0, 'scripts')
          import build_installer
          commits = int(subprocess.run(['git', 'rev-list', '--count', 'HEAD'], check=True,
                                       capture_output=True, text=True).stdout)
          version = build_installer.release_version(commits)
          # Only main publishes; pull requests and other branches build an artifact only.
          publish = (os.environ['GITHUB_EVENT_NAME'] in ('push', 'workflow_dispatch')
                     and os.environ['GITHUB_REF'] == 'refs/heads/main')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\npublish={str(publish).lower()}\n')
          print('CryptoPilot', version, '(publish)' if publish else '(artifact only)')

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create build environment
        run: |
          python -m venv .build-venv
          .build-venv\Scripts\python.exe scripts\bootstrap.py --build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run tests on Windows
        run: |
          .build-venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-dev-lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .build-venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build dependency runtime
        run: |
          .build-venv\Scripts\python.exe -m PyInstaller --noconfirm --distpath dist\editable-runtime CryptoPilotEditable.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Compile installer
        run: |
          .build-venv\Scripts\python.exe scripts\build_installer.py --runtime-dir dist\editable-runtime\CryptoPilotRuntime --stage dist\editable-stage --output dist\installer --version ${{ steps.version.outputs.version }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Smoke test frozen runtime (simulated exchange)
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\frozen" | Out-Null
          .build-venv\Scripts\python.exe tests\smoke_frozen_orders.py --runtime dist\editable-runtime\CryptoPilotRuntime --work "$env:RUNNER_TEMP\frozen"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Smoke test installer (install, update, upgrade, uninstall)
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\setup" | Out-Null
          .build-venv\Scripts\python.exe tests\smoke_installer.py --setup "dist\installer\CryptoPilot-Setup-${{ steps.version.outputs.version }}.exe" --work "$env:RUNNER_TEMP\setup"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Write checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          setup = Path('dist/installer/CryptoPilot-Setup-${{ steps.version.outputs.version }}.exe')
          digest = hashlib.sha256(setup.read_bytes()).hexdigest()
          setup.with_name(setup.name + '.sha256').write_text(f'{digest}  {setup.name}\n', encoding='ascii')
          print(digest, setup.name)

      - uses: actions/upload-artifact@v6
        with:
          name: CryptoPilot-Setup-${{ steps.version.outputs.version }}
          path: |
            dist/installer/CryptoPilot-Setup-*.exe
            dist/installer/CryptoPilot-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Keep smoke-test logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/setup/**/*.log
            ${{ runner.temp }}/setup/**/result.json
          if-no-files-found: ignore

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: CryptoPilot-Setup-${{ needs.build.outputs.version }}
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A re-run of the same commit has the same version; never replace a published release.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CryptoPilot $VERSION" --generate-notes --latest
